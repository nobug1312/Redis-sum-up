<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img"><defs></defs><rect x="1" y="1" width="898" height="398" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">TTL – &quot;hạn sử dụng&quot; của key</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Ví dụ: mã OTP sống 60 giây rồi Redis tự xóa</text><rect x="100" y="160" width="640" height="16" rx="8" fill="#15803D" stroke="#15803D" stroke-width="2"/><line x1="740" y1="168" x2="840" y2="168" stroke="#64748B" stroke-width="4" stroke-dasharray="8 6"/><circle cx="100" cy="168" r="11" fill="white" stroke="#0F172A" stroke-width="3"/><text x="100" y="202" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">giây 0</text><circle cx="420" cy="168" r="11" fill="white" stroke="#0F172A" stroke-width="3"/><text x="420" y="202" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">giây 30</text><circle cx="740" cy="168" r="11" fill="white" stroke="#0F172A" stroke-width="3"/><text x="740" y="202" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">giây 60</text><text x="420" y="150" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">key còn sống</text><text x="790" y="150" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">đã xóa</text><text x="60" y="108" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">SET otp:0901 &quot;123456&quot; EX 60</text><text x="60" y="128" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#334155" xml:space="preserve">→ lưu mã, hạn 60 giây</text><text x="420" y="108" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">GET otp:0901</text><text x="420" y="128" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#334155" xml:space="preserve">→ &quot;123456&quot;</text><text x="850" y="108" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#DC382D" xml:space="preserve">Redis tự xóa key</text><text x="850" y="128" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="end" fill="#334155" xml:space="preserve">GET otp:0901 → (nil)</text><text x="100" y="232" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">TTL → 60</text><text x="420" y="232" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">TTL → 30</text><text x="740" y="232" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">TTL → -2</text><text x="450" y="278" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Đọc kết quả lệnh TTL</text><rect x="40" y="295" width="260" height="70" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="170" y="325" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">&gt; 0</text><text x="170" y="350" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">còn sống N giây</text><rect x="320" y="295" width="260" height="70" rx="10" fill="#FFF4E5" stroke="#C2410C" stroke-width="2"/><text x="450" y="325" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#C2410C" xml:space="preserve">-1</text><text x="450" y="350" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">có key, KHÔNG có hạn (sống mãi)</text><rect x="600" y="295" width="260" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="730" y="325" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">-2</text><text x="730" y="350" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">KHÔNG có key (chưa tạo / đã xóa)</text></svg>
