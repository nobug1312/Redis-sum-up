<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img"><defs><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="1" y="1" width="898" height="468" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Hash – một object có nhiều field (giống class trong C#)</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">HSET user:1 name &quot;An&quot; age 25 city &quot;Ha Noi&quot;</text><rect x="40" y="165" width="110" height="46" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="95" y="194" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">user:1</text><line x1="152" y1="188" x2="196" y2="188" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><rect x="200" y="95" width="260" height="40" rx="4" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/><text x="255" y="121" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">field</text><text x="385" y="121" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">value</text><rect x="200" y="135" width="110" height="44" rx="0" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><rect x="310" y="135" width="150" height="44" rx="0" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="255" y="163" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">name</text><text x="385" y="163" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">&quot;An&quot;</text><rect x="200" y="179" width="110" height="44" rx="0" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><rect x="310" y="179" width="150" height="44" rx="0" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="255" y="207" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">age</text><text x="385" y="207" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">25</text><rect x="200" y="223" width="110" height="44" rx="0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><rect x="310" y="223" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="255" y="251" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">city</text><text x="385" y="251" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">&quot;Ha Noi&quot;</text><line x1="462" y1="157" x2="520" y2="157" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah7C3AED)"/><text x="528" y="152" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">HGET user:1 name  → &quot;An&quot;</text><text x="528" y="171" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" xml:space="preserve">chỉ lấy 1 field, không lấy cả object</text><line x1="462" y1="201" x2="520" y2="201" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah7C3AED)"/><text x="528" y="205" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">HINCRBY user:1 age 1  → 26</text><text x="528" y="224" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" xml:space="preserve">chỉ sửa đúng field age</text><text x="528" y="262" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="normal" text-anchor="start" fill="#334155" xml:space="preserve">HGETALL user:1 → lấy tất cả field</text><text x="450" y="300" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">So sánh khi cần tăng tuổi lên 1</text><rect x="40" y="315" width="400" height="135" rx="10" fill="#FFF4E5" stroke="#C2410C" stroke-width="2"/><text x="240" y="342" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#C2410C" xml:space="preserve">String chứa JSON</text><text x="240" y="368" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">{&quot;name&quot;:&quot;An&quot;,&quot;age&quot;:25,&quot;city&quot;:&quot;Ha Noi&quot;}</text><text x="60" y="396" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">1. GET cả chuỗi → 2. parse JSON, sửa age</text><text x="60" y="416" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">3. SET lại TOÀN BỘ chuỗi</text><rect x="460" y="315" width="400" height="135" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="660" y="342" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">Hash</text><text x="660" y="368" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">HINCRBY user:1 age 1</text><text x="480" y="396" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">1 lệnh, chỉ đụng field age</text><text x="480" y="416" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">→ đơn giản, ít dữ liệu qua mạng hơn</text></svg>
