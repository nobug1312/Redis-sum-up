<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img"><defs><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="1" y="1" width="898" height="488" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Redis chạy lệnh trên 1 luồng chính – như quầy chỉ có 1 thu ngân</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Mỗi thời điểm chỉ một lệnh được chạy; lệnh nặng bắt cả hàng phải chờ</text><text x="40" y="98" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#DC382D" xml:space="preserve">❶ Dùng KEYS * : chặn tất cả</text><text x="40" y="131" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155" xml:space="preserve">Client 1</text><text x="40" y="169" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155" xml:space="preserve">Client 2</text><text x="40" y="207" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155" xml:space="preserve">Client 3</text><text x="40" y="245" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155" xml:space="preserve">Client 4