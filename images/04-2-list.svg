<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img"><defs><marker id="ah15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="ah7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="1" y="1" width="898" height="378" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">List – danh sách có 2 đầu: Left (đầu) và Right (cuối)</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">L = Left, R = Right · PUSH = thêm vào · POP = lấy ra (và xóa khỏi list)</text><text x="450" y="112" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">viewed:user:1</text><rect x="255" y="125" width="130" height="60" rx="4" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="320" y="162" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">&quot;mu&quot;</text><text x="320" y="207" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">vị trí 0</text><rect x="385" y="125" width="130" height="60" rx="4" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="450" y="162" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">&quot;giay&quot;</text><text x="450" y="207" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">vị trí 1</text><rect x="515" y="125" width="130" height="60" rx="4" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="580" y="162" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">&quot;ao-thun&quot;</text><text x="580" y="207" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748B" xml:space="preserve">vị trí 2</text><text x="320" y="226" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">(mới nhất)</text><text x="580" y="226" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">(cũ nhất)</text><text x="150" y="108" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">LEFT – đầu</text><text x="750" y="108" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7C3AED" xml:space="preserve">RIGHT – cuối</text><line x1="60" y1="140" x2="248" y2="140" stroke="#15803D" stroke-width="2.5" marker-end="url(#ah15803D)"/><text x="150" y="133" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">LPUSH: thêm vào đầu</text><line x1="250" y1="172" x2="60" y2="172" stroke="#15803D" stroke-width="2.5" marker-end="url(#ah15803D)"/><text x="150" y="192" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">LPOP: lấy ra ở đầu</text><line x1="840" y1="140" x2="652" y2="140" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah7C3AED)"/><text x="750" y="133" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7C3AED" xml:space="preserve">RPUSH: thêm vào cuối</text><line x1="650" y1="172" x2="840" y2="172" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah7C3AED)"/><text x="750" y="192" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7C3AED" xml:space="preserve">RPOP: lấy ra ở cuối</text><rect x="40" y="255" width="400" height="105" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="60" y="282" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">Lịch sử vừa xem</text><text x="60" y="306" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">LPUSH mỗi khi xem → mới nhất luôn ở vị trí 0</text><text x="60" y="326" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">LRANGE viewed:user:1 0 9</text><text x="60" y="346" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">→ lấy 10 sản phẩm xem gần nhất</text><rect x="460" y="255" width="400" height="105" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="480" y="282" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">Hàng đợi: ai vào trước được xử lý trước</text><text x="480" y="306" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">RPUSH email:queue &quot;email-1&quot; &quot;email-2&quot;</text><text x="480" y="326" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">LPOP email:queue → &quot;email-1&quot;</text><text x="480" y="346" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">→ vào ở cuối, lấy ra ở đầu (như xếp hàng)</text></svg>
