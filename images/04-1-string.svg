<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img"><defs><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="1" y="1" width="898" height="328" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">String – một ô chứa một giá trị</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Dùng cho cache, bộ đếm, mã OTP, token</text><text x="40" y="100" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">Cache một sản phẩm</text><rect x="40" y="115" width="140" height="46" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/><text x="110" y="144" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">product:42</text><line x1="182" y1="138" x2="226" y2="138" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><rect x="230" y="115" width="190" height="46" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="325" y="144" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">&quot;Ban phim co&quot;</text><text x="40" y="195" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">SET product:42 &quot;Ban phim co&quot; EX 300</text><text x="40" y="217" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">GET product:42   → &quot;Ban phim co&quot;</text><text x="40" y="239" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">GET product:999  → (nil)</text><text x="40" y="262" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#C2410C" xml:space="preserve">(nil) = không có → cache miss</text><line x1="450" y1="85" x2="450" y2="300" stroke="#E2E8F0" stroke-width="2"/><text x="480" y="100" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0F172A" xml:space="preserve">Bộ đếm lượt xem: page:views</text><rect x="480" y="120" width="60" height="50" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="510" y="152" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">0</text><line x1="542" y1="145" x2="576" y2="145" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><text x="560" y="135" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#334155" xml:space="preserve">INCR</text><rect x="580" y="120" width="60" height="50" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="610" y="152" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">1</text><line x1="642" y1="145" x2="676" y2="145" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><text x="660" y="135" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#334155" xml:space="preserve">INCR</text><rect x="680" y="120" width="60" height="50" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="710" y="152" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">2</text><line x1="742" y1="145" x2="776" y2="145" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><text x="760" y="135" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#334155" xml:space="preserve">INCR</text><rect x="780" y="120" width="60" height="50" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="810" y="152" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">3</text><rect x="480" y="200" width="380" height="80" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="495" y="228" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">INCR là thao tác nguyên tử (atomic):</text><text x="495" y="248" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">1.000 người bấm cùng lúc → kết quả đúng 1.000,</text><text x="495" y="268" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">không bị đếm sót</text></svg>
