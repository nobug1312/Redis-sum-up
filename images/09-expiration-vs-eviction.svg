363" y1="172" x2="387" y2="148" stroke="#DC382D" stroke-width="3"/><text x="375" y="205" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#DC382D" xml:space="preserve">key bị xóa</text><text x="60" y="250" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Ai quyết định: BẠN (đặt TTL)</text><text x="60" y="278" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Khi nào: TTL đếm về 0</text><text x="60" y="306" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Xảy ra kể cả khi RAM còn trống</text><text x="60" y="334" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Ví dụ: OTP, session, cache</text><text x="240" y="380" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#15803D" xml:space="preserve" font-style="italic">Hộp sữa quá hạn → vứt</text><rect x="460" y="80" width="400" height="320" rx="10" fill="#FFF4E5" stroke="#C2410C" stroke-width="2"/><text x="660" y="108" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#C2410C" xml:space="preserve">Eviction (đuổi bớt)</text><rect x="490" y="140" width="110" height="200" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="2"/><rect x="495" y="300" width="100" height="36" rx="3" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><t