ke-width="2.5" marker-end="url(#ahDC382D)"/><text x="655" y="300" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#DC382D" xml:space="preserve">product:1</text><text x="655" y="317" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#DC382D" xml:space="preserve">lâu nhất chưa dùng</text><text x="655" y="334" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#DC382D" xml:space="preserve">→ bị xóa (allkeys-lru)</text><text x="620" y="240" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Ai quyết định: REDIS</text><text x="620" y="259" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  theo maxmemory-policy</text><text x="620" y="278" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Khi nào: chạm maxmemory</text><text x="660" y="380" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#C2410C" xml:space="preserve" font-style="italic">Tủ lạnh đầy → vứt bớt đồ cũ</text><rect x="40" y="415" width="820" height="40" rx="10" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="2"/><text x="450" y="440" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#334155" xml:space="preserve">Mặc định: maxmemory = 0 (không giới hạn), ma