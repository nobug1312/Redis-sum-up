<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><defs><marker id="ah2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ahDC382D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC382D"/></marker></defs><rect x="1" y="1" width="898" height="418" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Replication – primary nhận ghi, replica sao chép lại</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Giống giáo viên giảng bài, trợ giảng chép lại y hệt</text><rect x="40" y="180" width="160" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="120.0" y="220.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Ứng dụng</text><rect x="330" y="90" width="230" height="80" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="445.0" y="123.625" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Primary</text><text x="445.0" y="146.575" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">nhận GHI (và đọc)</text><rect x="230" y="290" width="200" height="75" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="330.0" y="321.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Replica 1</text><text x="330.0" y="343.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">bản sao, phục vụ đọc</text><rect x="460" y="290" width="200" height="75" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="560.0" y="321.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Replica 2</text><text x="560.0" y="343.1" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">bản sao, phục vụ đọc</text><line x1="202" y1="200" x2="326" y2="140" stroke="#DC382D" stroke-width="2.5" marker-end="url(#ahDC382D)"/><text x="120" y="160" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#DC382D" xml:space="preserve">ghi: SET, DEL…</text><line x1="202" y1="235" x2="226" y2="310" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ah2563EB)"/><text x="120" y="290" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#2563EB" xml:space="preserve">đọc: GET…</text><line x1="410" y1="172" x2="340" y2="286" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><line x1="480" y1="172" x2="550" y2="286" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><text x="445" y="225" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155" xml:space="preserve">sao chép</text><text x="445" y="243" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#334155" xml:space="preserve">(trễ nhỏ)</text><rect x="690" y="80" width="180" height="130" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="705" y="105" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">Primary chết →</text><text x="705" y="129" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">1 replica lên thay</text><text x="705" y="153" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">(failover)</text><text x="705" y="177" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">→ hệ thống vẫn chạy</text><rect x="690" y="225" width="180" height="165" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="705" y="250" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">Lưu ý:</text><text x="705" y="269" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• Primary chết ngay sau</text><text x="705" y="288" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  khi ghi → vài lệnh cuối</text><text x="705" y="307" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  có thể chưa kịp chép</text><text x="705" y="326" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• KHÔNG phải backup:</text><text x="705" y="345" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  lỡ DEL trên primary</text><text x="705" y="364" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  → replica cũng DEL</text></svg>
