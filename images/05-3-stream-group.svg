<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img"><defs><marker id="ah15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="ah334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ahC2410C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect x="1" y="1" width="898" height="518" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Stream + consumer group – như bếp nhà hàng</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Mỗi order chỉ giao cho 1 đầu bếp trong nhóm; xong phải báo (XACK)</text><rect x="40" y="115" width="150" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="115.0" y="144.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Phục vụ</text><text x="115.0" y="165.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">(producer)</text><line x1="192" y1="150" x2="236" y2="150" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><text x="214" y="138" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155" xml:space="preserve">① XADD</text><rect x="240" y="90" width="270" height="120" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="375" y="115" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2563EB" xml:space="preserve">Stream: orders (cuốn sổ)</text><rect x="255" y="135" width="74" height="55" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="292" y="168" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">1001</text><rect x="337" y="135" width="74" height="55" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="374" y="168" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">1002</text><rect x="419" y="135" width="74" height="55" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="456" y="168" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">1003</text><rect x="650" y="80" width="220" height="270" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="2" stroke-dasharray="8 5"/><text x="760" y="104" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#C2410C" xml:space="preserve">Nhóm &quot;kitchen&quot;</text><text x="760" y="122" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#C2410C" xml:space="preserve">(consumer group)</text><rect x="665" y="140" width="190" height="80" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="760.0" y="164.25" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">chef-1</text><text x="760.0" y="184.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">nhận 1001</text><text x="760.0" y="204.75" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">nấu xong → ③ XACK</text><rect x="665" y="255" width="190" height="80" rx="10" fill="#FFF4E5" stroke="#C2410C" stroke-width="2"/><text x="760.0" y="279.25" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">chef-2</text><text x="760.0" y="299.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">nhận 1002</text><text x="760.0" y="319.75" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">đang nấu… (chưa ACK)</text><line x1="512" y1="165" x2="661" y2="180" stroke="#15803D" stroke-width="2.5" marker-end="url(#ah15803D)"/><line x1="512" y1="195" x2="661" y2="290" stroke="#C2410C" stroke-width="2.5" marker-end="url(#ahC2410C)"/><text x="585" y="150" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155" xml:space="preserve">② XREADGROUP</text><rect x="240" y="255" width="270" height="95" rx="10" fill="#FFF4E5" stroke="#C2410C" stroke-width="2"/><text x="375" y="280" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#C2410C" xml:space="preserve">Pending = đã giao, CHƯA ACK</text><text x="375" y="308" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">1002 → chef-2</text><text x="375" y="334" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">1001 → đã XACK nên không còn ở đây</text><rect x="40" y="375" width="820" height="130" rx="10" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="2"/><text x="60" y="402" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">① XADD: ghi order vào sổ. Sổ không bị xé sau khi đọc.</text><text x="60" y="428" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">② XREADGROUP … &gt;: mỗi order mới chỉ giao cho 1 chef trong nhóm → order vào danh sách Pending.</text><text x="60" y="454" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">③ XACK: chef báo đã xong → order rời khỏi Pending.</text><text x="60" y="480" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">Nếu chef-2 nghỉ giữa chừng: 1002 vẫn ở Pending → chef khác nhận lại (XCLAIM / XAUTOCLAIM).</text></svg>
