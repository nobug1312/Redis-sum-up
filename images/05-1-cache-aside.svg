nt-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">3. SET product:42 &lt;data&gt; EX 300</text><text x="730.0" y="401.675" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">lưu vào Redis, hạn 5 phút</text><path d="M730,419 L730,445 L596,445" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah334155)"/><rect x="310" y="420" width="284" height="50" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="452.0" y="449.5" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Trả kết quả cho người dùng</text><rect x="40" y="488" width="820" height="40" rx="10" fill="#F1F5F9" stroke="#F1F5F9" stroke-width="2"/><text x="450" y="513" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#334155" xml:space="preserve">Nhớ: luôn đặt TTL  ·  dữ liệu gốc đổi → DEL product:42  ·  key hot hết hạn → coi chừng cache stampede</text></svg>
