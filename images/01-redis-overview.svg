<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img"><defs><marker id="ah2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahDC382D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC382D"/></marker></defs><rect x="1" y="1" width="898" height="418" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Redis = cái bàn trước mặt, Database = kho sách dưới hầm</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Ứng dụng hỏi Redis trước; chỉ khi Redis không có mới phải xuống database</text><rect x="40" y="175" width="170" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="125.0" y="213.25" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Ứng dụng</text><text x="125.0" y="237.55" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">(web, API)</text><rect x="330" y="90" width="300" height="125" rx="10" fill="#FDECEA" stroke="#DC382D" stroke-width="2"/><text x="480.0" y="121.45" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Redis</text><text x="480.0" y="145.75" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">Lưu trên RAM</text><text x="480.0" y="170.05" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">Rất nhanh (thường &lt; 1 ms)</text><text x="480.0" y="194.35000000000002" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">Bàn nhỏ: RAM có hạn, đắt</text><rect x="330" y="260" width="300" height="125" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="480.0" y="291.45" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Database</text><text x="480.0" y="315.75" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">SQL Server, PostgreSQL…</text><text x="480.0" y="340.05" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">Lưu trên ổ đĩa → chậm hơn</text><text x="480.0" y="364.35" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#0F172A" xml:space="preserve">Kho lớn: chứa nhiều, lâu dài</text><line x1="210" y1="205" x2="326" y2="155" stroke="#DC382D" stroke-width="2.5" marker-end="url(#ahDC382D)"/><line x1="210" y1="240" x2="326" y2="320" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah2563EB)"/><text x="40" y="150" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#DC382D" xml:space="preserve">① hỏi Redis trước</text><text x="40" y="292" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2563EB" xml:space="preserve">② chỉ khi Redis</text><text x="40" y="311" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2563EB" xml:space="preserve">    không có</text><rect x="665" y="110" width="205" height="250" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="767" y="140" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Ví dụ: 10.000 lượt</text><text x="767" y="160" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">xem sản phẩm / phút</text><text x="685" y="200.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• 1 lượt đọc database</text><text x="685" y="220.3" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  (lần đầu, rồi lưu</text><text x="685" y="240.6" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  vào Redis)</text><text x="685" y="260.9" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">• 9.999 lượt đọc</text><text x="685" y="281.2" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">  thẳng từ Redis</text><text x="767" y="335" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803D" xml:space="preserve">→ database được nghỉ</text></svg>
