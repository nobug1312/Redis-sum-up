<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img"><defs></defs><rect x="1" y="1" width="898" height="448" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="450.0" y="38" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A" xml:space="preserve">Persistence: RDB chụp ảnh định kỳ, AOF ghi nhật ký từng lệnh</text><text x="450.0" y="62" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#64748B" xml:space="preserve">Khi Redis gặp sự cố, mỗi cách mất bao nhiêu dữ liệu?</text><text x="40" y="112" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#334155" xml:space="preserve">Lệnh ghi</text><line x1="160" y1="108" x2="840" y2="108" stroke="#CBD5E1" stroke-width="2"/><circle cx="170" cy="108" r="7" fill="#0F172A"/><circle cx="240" cy="108" r="7" fill="#0F172A"/><circle cx="310" cy="108" r="7" fill="#0F172A"/><circle cx="380" cy="108" r="7" fill="#0F172A"/><circle cx="450" cy="108" r="7" fill="#0F172A"/><circle cx="520" cy="108" r="7" fill="#0F172A"/><circle cx="590" cy="108" r="7" fill="#0F172A"/><circle cx="660" cy="108" r="7" fill="#0F172A"/><circle cx="720" cy="108" r="7" fill="#0F172A"/><text x="40" y="182" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#2563EB" xml:space="preserve">RDB</text><text x="40" y="200" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#64748B" xml:space="preserve">snapshot</text><line x1="160" y1="180" x2="840" y2="180" stroke="#CBD5E1" stroke-width="2"/><rect x="480" y="165" width="280" height="30