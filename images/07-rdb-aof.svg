l="#15803D" stroke="#15803D" stroke-width="2"/><rect x="586" y="248" width="8" height="24" rx="2" fill="#15803D" stroke="#15803D" stroke-width="2"/><rect x="656" y="248" width="8" height="24" rx="2" fill="#15803D" stroke="#15803D" stroke-width="2"/><rect x="705" y="245" width="55" height="30" rx="4" fill="#FDECEA" stroke="#DC382D" stroke-width="2" stroke-dasharray="5 4"/><text x="705" y="300" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#DC382D" xml:space="preserve">mất tối đa ~1 giây</text><line x1="760" y1="80" x2="760" y2="285" stroke="#DC382D" stroke-width="3"/><text x="768" y="92" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#DC382D" xml:space="preserve">SỰ CỐ</text><rect x="40" y="320" width="400" height="110" rx="10" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/><text x="60" y="345" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#2563EB" xml:space="preserve">RDB – chụp ảnh</text><text x="60" y="370" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">+ File nhỏ, khởi động lại nhanh</text><text x="60" y="392" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">− Có thể mất vài phút dữ liệu</text><rect x="460" y="320" width="400" height="110" rx="10" fill="#E7F6EC" stroke="#15803D" stroke-width="2"/><text x="480" y="345" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803D" xml:space="preserve">AOF – ghi nhật ký</text><text x="480" y="370" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">+ Mất rất ít dữ liệu</text><text x="480" y="392" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">− File lớn hơn, khởi động chậm hơn</text><text x="480" y="414" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0F172A" xml:space="preserve">Thực tế: bật cả hai + vẫn backup ra nơi khác</text></svg>
